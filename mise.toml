[tools]
"github:gastownhall/beads" = "1.3.1"

[env]
# cloudflare.env is not strict dotenv, so pull only the masky key out of it.
MASKY_API_KEY = "{{ exec(command='sed -n \"s/^masky_api_key=//p\" cloudflare.env | tr -d \"[:space:]\"') }}"

# Commits in this repo are always lmist, whatever the global git config says.
GIT_AUTHOR_NAME = "lmist"
GIT_AUTHOR_EMAIL = "93909160+lmist@users.noreply.github.com"
GIT_COMMITTER_NAME = "lmist"
GIT_COMMITTER_EMAIL = "93909160+lmist@users.noreply.github.com"
